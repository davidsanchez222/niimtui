name: release

# Tag pushes are the normal path. workflow_dispatch is for re-running a release;
# run it against a tag ref, since GoReleaser requires a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      # Exit 2 means the config is valid but uses deprecated keys (the `brews`
      # section, kept on purpose). Exit 1 means invalid config and still fails.
      - name: goreleaser check
        run: goreleaser check || [ $? -eq 2 ]
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with contents write access to davidsanchez222/homebrew-tap.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
