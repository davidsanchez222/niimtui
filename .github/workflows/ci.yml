name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macOS only for now: the BLE dependency needs native macOS tooling and
    # releases are built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      # Exit 2 means the config is valid but uses deprecated keys (the `brews`
      # section, kept on purpose). Exit 1 means invalid config and still fails.
      - name: goreleaser check
        run: goreleaser check || [ $? -eq 2 ]
